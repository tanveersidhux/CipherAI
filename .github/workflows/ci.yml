name: CIPHER AI Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend (web/) CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Lint Code (oxlint)
        run: npm run lint

      - name: Verify TypeScript Types
        run: npm run typecheck

      - name: Run Frontend Tests (Vitest)
        run: npm run test

      - name: Build Production Bundle
        run: npm run build

      - name: Verify No Secrets in Frontend Workspace
        working-directory: .
        run: node scripts/check-no-secrets-in-web.mjs

  api:
    name: Backend (api/) CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check Formatting (Ruff)
        run: ruff format --check .

      - name: Lint Code (Ruff)
        run: ruff check .

      - name: Run Backend Tests with Coverage (Pytest)
        env:
          APP_ENV: test
          LOG_LEVEL: WARNING
        run: pytest --cov=app --cov-report=term-missing
