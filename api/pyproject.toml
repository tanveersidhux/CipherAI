[project]
name = "cipher-ai-api"
version = "1.0.0"
description = "FastAPI threat intelligence backend for CIPHER AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.11",
    "uvicorn==0.34.0",
    "pydantic==2.10.6",
    "pydantic-settings==2.8.1",
    "httpx==0.28.1",
    "tldextract==5.4.0",
    "idna==3.20",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.0.0",
    "ruff==0.9.9",
    "jsonschema==4.26.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "B008",   # Do not perform function call in argument defaults (standard for FastAPI Depends)
    "E501",   # Line length handled by formatter
    "UP042",  # Pydantic v2 str, Enum inheritance preserved
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=app --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
]
